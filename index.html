<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ANUELS Laundromat</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,600&family=Hanken+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>

/* Layout: one-screen app. Slim brand bar, full-bleed 3D stage, control dock underneath.
   Palette: dark walnut, cream, brass. */
:root{
  --bg:#F1EBE2; --panel:#FAF6F0; --ink:#2A1D14; --ink2:#6B5A4C; --line:#DCCFC0;
  --accent:#5A3724; --accent-ink:#FFFFFF; --brass:#9A6F1E; --stage:#E6DCCD; --ground:#CFC3B1;
  --glass:rgba(250,246,240,.88);
  --disp:"Bodoni Moda",Georgia,serif; --sans:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#15100C; --panel:#1D1611; --ink:#F0E6D8; --ink2:#B3A18E; --line:#3A2D22;
    --accent:#C99A5B; --accent-ink:#1A0F07; --brass:#D6AC57; --stage:#1A130E; --ground:#241A13;
    --glass:rgba(29,22,17,.88); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15100C; --panel:#1D1611; --ink:#F0E6D8; --ink2:#B3A18E; --line:#3A2D22;
  --accent:#C99A5B; --accent-ink:#1A0F07; --brass:#D6AC57; --stage:#1A130E; --ground:#241A13;
  --glass:rgba(29,22,17,.88); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 var(--sans);overflow:hidden}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
  padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.mark{font:600 24px/1 var(--disp);letter-spacing:.07em;color:var(--ink)}
.sub{font:500 11px/1 var(--sans);letter-spacing:.24em;text-transform:uppercase;color:var(--brass)}
.tools{display:flex;align-items:center;gap:8px}
.dimtag{font:500 12px/1 var(--mono);color:var(--ink2);border:1px solid var(--line);border-radius:6px;padding:7px 8px;white-space:nowrap}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);font:500 13px/1 var(--sans);padding:8px 12px;border-radius:8px;min-height:32px;cursor:pointer}
.btn[aria-expanded="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
.stage{position:relative;min-height:0;overflow:hidden;background:var(--stage);touch-action:none}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
.labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lab{position:absolute;left:0;top:0;white-space:nowrap;background:var(--glass);border:1px solid var(--line);
  border-radius:6px;padding:2px 6px;font-size:11px;line-height:1.25;color:var(--ink);will-change:transform}
.lab b{display:block;font-weight:600}
.lab span{font-family:var(--mono);color:var(--ink2);font-size:11px}
.lab.dim{border-color:var(--brass);color:var(--brass)}
.lab.dim span{color:var(--brass)}
.hint{position:absolute;left:50%;top:10px;transform:translateX(-50%);max-width:calc(100% - 32px);width:max-content;
  background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12px;
  color:var(--ink2);text-align:center;pointer-events:none;transition:opacity .6s}
.layers{position:absolute;top:10px;right:max(16px,env(safe-area-inset-right,0px));z-index:5;width:min(260px,calc(100% - 32px));
  background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px;display:grid;gap:2px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 8px;border-radius:8px;font-size:14px;cursor:pointer}
.row small{display:block;color:var(--ink2);font-size:12px}
.row span{min-width:0}
.row input{appearance:none;-webkit-appearance:none;width:38px;height:22px;border-radius:999px;background:var(--line);position:relative;margin:0;flex:none;cursor:pointer;transition:background .15s}
.row input::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--panel);transition:transform .15s}
.row input:checked{background:var(--accent)}
.row input:checked::after{transform:translateX(16px);background:var(--accent-ink)}
.stick{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:16px;width:116px;height:116px;border-radius:50%;
  border:1.5px solid var(--line);background:var(--glass);touch-action:none;display:grid;place-items:center}
.knob{width:46px;height:46px;border-radius:50%;background:var(--accent);opacity:.9}
.dock{background:var(--panel);border-top:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:grid;gap:8px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;color:var(--ink2);font:500 14px/1 var(--sans);padding:0 6px;min-height:40px;border-radius:8px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.goto{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.goto em{font:500 11px/1 var(--mono);font-style:normal;color:var(--ink2);text-transform:uppercase;letter-spacing:.1em;margin-right:2px}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink);font:500 13px/1 var(--sans);padding:8px 11px;border-radius:999px;cursor:pointer}
.chip:hover{border-color:var(--accent)}
.err{padding:16px;color:var(--ink)}

.layers{max-height:min(62%,430px);overflow:auto;-webkit-overflow-scrolling:touch}
@media (max-width:600px){.layers{width:min(230px,calc(100% - 32px))}.tour{bottom:8px;padding:10px 12px}.tour p{font-size:12px}}
.layers h4{margin:8px 8px 2px;font:500 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)}
.sl{display:grid;grid-template-columns:64px 1fr 46px;align-items:center;gap:8px;padding:6px 8px;font-size:13px}
.sl output{font:500 12px/1 var(--mono);color:var(--ink2);text-align:right}
.sl input{width:100%;accent-color:var(--accent);min-height:28px}
.mini{display:flex;gap:4px;padding:4px 8px 8px}
.mini button{flex:1;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;padding:8px;font:500 13px/1 var(--sans);cursor:pointer;min-height:36px}
.mini button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.lab.k{border-color:var(--accent)}
.tour{position:absolute;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:12px;margin:auto;max-width:460px;z-index:6;
  background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:8px}
.tour b{font:600 15px/1.2 var(--disp)}
.tour p{margin:0;color:var(--ink2);font-size:13px}
.tour .nav{display:flex;gap:8px;align-items:center;justify-content:space-between}
.tour .nav span{font:500 12px/1 var(--mono);color:var(--ink2)}
.tour .nav div{display:flex;gap:6px}
.tour button{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;padding:8px 12px;font:500 13px/1 var(--sans);cursor:pointer;min-height:34px}
.tour button.go{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.seg{grid-template-columns:repeat(4,1fr)}
</style>
</head>
<body>


<div class="app">
  <header class="bar">
    <div class="brand"><span class="mark">ANUELS</span><span class="sub">Laundromat</span></div>
    <div class="tools">
      <span class="dimtag" id="dimtag">15 × 8.5 ft</span>
      <button class="btn" id="layersBtn" aria-expanded="false" aria-controls="layers">Layers</button>
    </div>
  </header>

  <main class="stage" id="stage">
    <canvas id="gl" aria-label="Interactive 3D model of the ANUELS Laundromat caravan"></canvas>
    <div class="labels" id="labels"></div>
    <div class="hint" id="hint"></div>
    <div class="layers" id="layers" hidden>
      <h4>Show</h4>
      <label class="row"><span>Roof</span><input type="checkbox" id="t-roof"></label>
      <label class="row"><span>Full front wall<small>The long wall with the door</small></span><input type="checkbox" id="t-front"></label>
      <label class="row"><span>Partition<small>Laundry / lounge divider</small></span><input type="checkbox" id="t-part"></label>
      <label class="row"><span>See-through counters<small>Shows machines from above</small></span><input type="checkbox" id="t-see"></label>
      <label class="row"><span>Sliding door open</span><input type="checkbox" id="t-door"></label>
      <label class="row"><span>Labels</span><input type="checkbox" id="t-labels"></label>
      <label class="row"><span>Water x-ray<small>Borehole, tank, pump, drain</small></span><input type="checkbox" id="t-plumb"></label>
      <label class="row"><span>Power x-ray<small>Generator vs ITEL circuits</small></span><input type="checkbox" id="t-elec"></label>
      <label class="row"><span>Dimensions</span><input type="checkbox" id="t-dims"></label>
      <h4>Size (metres)</h4>
      <label class="sl">Length<input type="range" id="s-len" min="3.6" max="6" step="0.05" value="4.57"><output id="o-len"></output></label>
      <label class="sl">Width<input type="range" id="s-wid" min="2.5" max="3" step="0.05" value="2.6"><output id="o-wid"></output></label>
      <label class="sl">Height<input type="range" id="s-hgt" min="2.2" max="2.8" step="0.05" value="2.5"><output id="o-hgt"></output></label>
      <h4>Floor</h4>
      <div class="mini" id="floorSw"><button data-f="walnut" aria-pressed="true">Walnut vinyl</button><button data-f="grey" aria-pressed="false">Grey vinyl</button></div>
    </div>
    <div class="tour" id="tour" hidden>
      <b id="tTitle"></b><p id="tText"></p>
      <div class="nav"><span id="tCount"></span><div><button id="tPrev">Back</button><button id="tNext" class="go">Next</button><button id="tClose">Close</button></div></div>
    </div>
    <div class="stick" id="stick" hidden aria-label="Walk joystick"><div class="knob" id="knob"></div></div>
  </main>

  <footer class="dock">
    <div class="seg" role="group" aria-label="View mode">
      <button data-mode="orbit" aria-pressed="true">Orbit</button>
      <button data-mode="top" aria-pressed="false">Top view</button>
      <button data-mode="walk" aria-pressed="false">Walk inside</button>
      <button data-mode="tour" aria-pressed="false">Tour</button>
    </div>
    <div class="goto">
      <em>Go to</em>
      <button class="chip" data-view="laundry">Laundry</button>
      <button class="chip" data-view="press">Pressing</button>
      <button class="chip" data-view="lounge">Lounge</button>
      <button class="chip" data-view="window">Window</button>
      <button class="chip" data-view="door">Door</button>
      <button class="chip" data-view="tank">Tank</button>
    </div>
  </footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
'use strict';
var stage=document.getElementById('stage');
if(typeof THREE==='undefined'||!THREE.OrbitControls){
  stage.insertAdjacentHTML('beforeend','<p class="err">The 3D viewer could not load. Check your connection and reload the page.</p>');
  return;
}
var $=function(id){return document.getElementById(id);};
var canvas=$('gl');
var renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
var scene=new THREE.Scene();
var cam=new THREE.PerspectiveCamera(45,1,0.05,150);
var controls=new THREE.OrbitControls(cam,canvas);
controls.enableDamping=true; controls.dampingFactor=0.08;
controls.maxPolarAngle=Math.PI*0.49; controls.minDistance=1.2; controls.maxDistance=26; controls.screenSpacePanning=true;

/* ---- dimensions (metres). X = length (laundry west/-X, lounge east/+X), Z = width (machines on back wall -Z, door on front wall +Z) ---- */
var D={len:4.57,wid:2.6,hgt:2.5};
var WT=0.086, PT=0.08, LW=1.75, WAIN=1.1, FLOOR='walnut';
var X0,X1,Z0,Z1,H,PX,ZP; /* set in build */

/* ---- materials ---- */
function mat(c,o){return new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:0.75,metalness:0},o||{}));}
var M={
  wallLow:mat(0x5B3A26,{roughness:0.6}), wallUp:mat(0xE6D8BF,{roughness:0.95}), film:mat(0x2F7FD6), insul:mat(0xE8C547,{roughness:1}), skin:mat(0xCFC2AE,{roughness:0.7}),
  walnut:mat(0x5A3724,{roughness:0.55}), walnutD:mat(0x3A2215,{roughness:0.5}), cab:mat(0x4B2D1C,{roughness:0.5}), top:mat(0x3A2214,{roughness:0.35}),
  brass:mat(0xC9A24B,{roughness:0.3,metalness:0.7}), white:mat(0xF3F3EF,{roughness:0.4}), dryer:mat(0xDEDDD6,{roughness:0.4}),
  silver:mat(0xC9CCCB,{roughness:0.3,metalness:0.5}), glassDark:mat(0x1E2E34,{roughness:0.1,metalness:0.2}),
  black:mat(0x111312,{roughness:0.5}), panel:mat(0x2B3033,{roughness:0.5}), cognac:mat(0x8A4B2A,{roughness:0.5}), cognacL:mat(0x9B5A35,{roughness:0.5}),
  rug:mat(0x8B2F2A,{roughness:1}), plinth:mat(0x2A2420,{roughness:0.9}), concrete:mat(0x9A9C98,{roughness:1}), steel:mat(0x3B4145,{roughness:0.5,metalness:0.4}),
  tank:mat(0x17191A,{roughness:0.6}), pumpBlue:mat(0x2B63A8,{roughness:0.5}), ceiling:mat(0xF6F0E4,{roughness:1}), oak:mat(0xB98E5A,{roughness:0.7}),
  glass:mat(0xBFE3DA,{transparent:true,opacity:0.22,roughness:0.05,depthWrite:false}),
  led:new THREE.MeshBasicMaterial({color:0xFFF1C9}), red:mat(0xC62828,{roughness:0.5}), gen:mat(0xD9A21B,{roughness:0.5}), green:mat(0x2E7D4F,{roughness:0.5}),
  cooler:mat(0xB71C1C,{roughness:0.4})
};
var LAY=[[0.012,'wallUp'],[0.004,'film'],[0.05,'insul'],[0.02,'skin']];
var groundMat=new THREE.MeshStandardMaterial({color:0xCFC3B1,roughness:1});

/* ---- builders (all take a parent group P) ---- */
function bx(x0,x1,y0,y1,z0,z1,m,P,sh){
  var o=new THREE.Mesh(new THREE.BoxGeometry(Math.max(1e-4,x1-x0),Math.max(1e-4,y1-y0),Math.max(1e-4,z1-z0)),m);
  o.position.set((x0+x1)/2,(y0+y1)/2,(z0+z1)/2); o.castShadow=sh!==false; o.receiveShadow=true; P.add(o); return o;
}
function cy(r,len,x,y,z,m,ax,P,r2){
  var o=new THREE.Mesh(new THREE.CylinderGeometry(r,r2===undefined?r:r2,len,28),m);
  if(ax==='x')o.rotation.z=Math.PI/2; else if(ax==='z')o.rotation.x=Math.PI/2;
  o.position.set(x,y,z); o.castShadow=true; o.receiveShadow=true; P.add(o); return o;
}
function ball(r,x,y,z,m,P){var o=new THREE.Mesh(new THREE.SphereGeometry(r,14,10),m);o.position.set(x,y,z);o.castShadow=true;P.add(o);return o;}
function pipe(a,b,r,m,P){
  var A=new THREE.Vector3(a[0],a[1],a[2]),B=new THREE.Vector3(b[0],b[1],b[2]),d=B.clone().sub(A),len=d.length();
  if(len<1e-4)return null;
  var o=new THREE.Mesh(new THREE.CylinderGeometry(r,r,len,10),m);
  o.position.copy(A).add(B).multiplyScalar(0.5);
  o.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize()); o.renderOrder=6; P.add(o); return o;
}
function path(pts,r,m,P){for(var i=0;i<pts.length-1;i++)pipe(pts[i],pts[i+1],r,m,P);for(var j=1;j<pts.length-1;j++){var s=ball(r*1.2,pts[j][0],pts[j][1],pts[j][2],m,P);s.renderOrder=6;}}
function xr(c){return new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:0.95,depthTest:false});}
function disposeGroup(g){
  g.traverse(function(o){if(o.geometry)o.geometry.dispose();});
  while(g.children.length)g.remove(g.children[0]);
}

/* ---- canvas textures ---- */
function canvasTex(w,h,fn){
  var c=document.createElement('canvas'); c.width=w; c.height=h; fn(c.getContext('2d'),w,h);
  var t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.anisotropy=4; return t;
}
function vinylTex(kind){
  return canvasTex(256,256,function(g,w,h){
    var seed=kind==='grey'?21:7;function rnd(){seed=(seed*9301+49297)%233280;return seed/233280;}
    for(var r=0;r<8;r++){
      var base=Math.floor(rnd()*22), col;
      if(kind==='grey'){var v=70+base;col='rgb('+v+','+(v+2)+','+(v+5)+')';}
      else col='rgb('+(92+base)+','+(58+base*0.6|0)+','+(36+base*0.4|0)+')';
      g.fillStyle=col;g.fillRect(0,r*32,w,32);
      var cut=(r%2?64:192)+Math.floor(rnd()*20)-10;
      g.fillStyle='rgba(0,0,0,.35)';g.fillRect(0,r*32,w,1.5);g.fillRect(cut,r*32,1.5,32);
      for(var k=0;k<6;k++){g.fillStyle=kind==='grey'?'rgba(255,255,255,.04)':'rgba(40,20,8,.10)';g.fillRect(rnd()*w,r*32+rnd()*30,50+rnd()*110,1.2);}
    }
  });
}
var texW=vinylTex('walnut'), texG=vinylTex('grey');
var signs=[];
function sign(w,h,draw){
  var c=document.createElement('canvas'); c.width=w; c.height=h; var g=c.getContext('2d'); draw(g,w,h);
  var t=new THREE.CanvasTexture(c); t.anisotropy=4; signs.push({g:g,w:w,h:h,draw:draw,t:t}); return t;
}
function spaced(g,text,cx,y,gap){
  var ws=[],tot=0,i; for(i=0;i<text.length;i++){var m=g.measureText(text[i]).width;ws.push(m);tot+=m;}
  tot+=gap*(text.length-1); var x=cx-tot/2; g.textAlign='left';
  for(i=0;i<text.length;i++){g.fillText(text[i],x,y);x+=ws[i]+gap;}
}
function signPlane(tex,w,h,x,y,z,ry,P){
  var m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:tex,transparent:true}));
  m.position.set(x,y,z); m.rotation.y=ry||0; P.add(m); return m;
}

/* ---- scene groups that persist; world is rebuilt ---- */
var world=new THREE.Group(); scene.add(world);
var ground=new THREE.Mesh(new THREE.CircleGeometry(20,64),groundMat);
ground.rotation.x=-Math.PI/2; ground.position.y=-0.301; ground.receiveShadow=true; scene.add(ground);
scene.add(new THREE.HemisphereLight(0xFFF3E0,0x6A5A48,0.75));
var sun=new THREE.DirectionalLight(0xFFEFD6,0.85); sun.position.set(5,9,6); sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048); var sc=sun.shadow.camera; sc.left=-8;sc.right=8;sc.top=8;sc.bottom=-8;sc.near=1;sc.far=30; sun.shadow.bias=-0.0005; scene.add(sun);
var warm1=new THREE.PointLight(0xFFD9A0,0.5,7,2), warm2=new THREE.PointLight(0xFFD9A0,0.5,7,2); scene.add(warm1); scene.add(warm2);

/* ---- state ---- */
var S={roof:false,front:false,part:true,see:false,door:false,labels:true,plumb:false,elec:false,dims:false};
var G={}; /* named groups per build */
var labs=[], labelsEl=$('labels'), obs=[], doorK=0;
function addLab(t,sub,p,o){
  o=o||{}; var d=document.createElement('div'); d.className='lab'+(o.cls?' '+o.cls:'');
  d.innerHTML='<b>'+t+'</b>'+(sub?'<span>'+sub+'</span>':''); labelsEl.appendChild(d);
  labs.push({el:d,p:p,cond:o.cond,near:o.near});
}
function clearLabs(){labs.forEach(function(l){l.el.remove();});labs=[];}
function onS(k){return function(){return S[k];};}

/* ---- wall builder with openings. axis 'x' = wall runs along X at z=fixed; 'z' = runs along Z at x=fixed. dir = outward sign ---- */
function seg(axis,fixed,dir,u0,u1,y0,y1,P){
  if(u1-u0<1e-4||y1-y0<1e-4)return;
  var o=0;
  LAY.forEach(function(L,i){
    var a=fixed+dir*o,b=fixed+dir*(o+L[0]),lo=Math.min(a,b),hi=Math.max(a,b),bands;

  var tg=tw.tg0.clone().lerp(tw.tg1,e);
  var s=new THREE.Spherical(tw.r0+(tw.r1-tw.r0)*e,tw.p0+(tw.p1-tw.p0)*e,tw.th0+tw.dth*e);
  controls.target.copy(tg); cam.position.copy(tg).add(new THREE.Vector3().setFromSpherical(s)); cam.lookAt(tg);
  if(k>=1)tw=null;
}
var hintEl=$('hint'),hintT=0;
function showHint(t){hintEl.textContent=t;hintEl.style.opacity='1';clearTimeout(hintT);hintT=setTimeout(function(){hintEl.style.opacity='0';},6000);}
var HINTS={orbit:'Drag to turn · pinch to zoom · two fingers to pan',top:'Roof off, counters see-through · drag to spin the plan',walk:'Left stick to move · drag to look · WASD on a keyboard',tour:'Guided tour'};

/* ---- tour ---- */
var STEPS=[
 {t:'The caravan',x:'Wider and taller than the first sketch. Door in the middle of the long side, laundry on the left, lounge on the right.',v:'orbit',s:{roof:false,front:false,plumb:false,elec:false,see:false}},
 {t:'From above',x:'Roof off. One long plain worktop runs over the dryer, both washers and the folding area. The partition hides the work from guests.',v:'top',s:{roof:false,see:true}},
 {t:'Laundry side',x:'L-shaped run: dryer on the short wall, two front-loaders on the long wall. Soap shelf, two racks and overhead duvet storage above.',v:'laundry',s:{roof:false,see:false}},
 {t:'Pressing and clothes',x:'Padded press table with a gravity-feed steam iron under the front window. Tall customer-clothes cabinet beside it; dirty-clothes bins under the worktop.',v:'press',s:{front:false}},
 {t:'Lounge',x:'Chesterfield, TV, PS5 shelf and games table. The mini fridge sits under the TV facing guests and the ITEL hangs on the wall beside it, so the entrance stays clear. Pay-to-charge dock on the end wall.',v:'lounge',s:{}},
 {t:'Service window',x:'You see the lounge from the laundry; guests cannot see your work. The split AC sits in this partition above the window and cools both sides. Windows at both ends give cross-ventilation.',v:'window',s:{}},
 {t:'Sliding door',x:'Glass door on an outside track, so it takes no floor space inside.',v:'door',s:{front:true,door:true}},
 {t:'Water',x:'Borehole feeds the reserve tank through a float valve. Pump pushes water to the machines. Dryer condensate and washers drain to the sloped trench.',v:'tank',s:{front:false,door:false,plumb:true}},
 {t:'Power',x:'Two separate circuits: generator for machines, iron and AC; ITEL power station for TV, PS5, fan, lights, CCTV, dock and cooler. Never joined.',v:'power',s:{plumb:false,elec:true,front:false}}
];
var ti=0,tourEl=$('tour');
function showStep(i){
  ti=Math.max(0,Math.min(STEPS.length-1,i)); var st=STEPS[ti];
  Object.keys(st.s).forEach(function(k){S[k]=st.s[k];});
  if(st.v==='top'){S.roof=false;} apply(); flyTo(getView(st.v),1000);
  $('tTitle').textContent=st.t; $('tText').textContent=st.x; $('tCount').textContent=(ti+1)+' / '+STEPS.length;
  $('tPrev').disabled=ti===0; $('tNext').textContent=ti===STEPS.length-1?'Done':'Next';
}
$('tPrev').addEventListener('click',function(){showStep(ti-1);});
$('tNext').addEventListener('click',function(){if(ti===STEPS.length-1)setMode('orbit');else showStep(ti+1);});
$('tClose').addEventListener('click',function(){setMode('orbit');});

/* ---- modes ---- */
var snap=null,autoSee=false;
var segBtns=Array.prototype.slice.call(document.querySelectorAll('.seg button'));
function setSegUI(){segBtns.forEach(function(b){b.setAttribute('aria-pressed',String(b.getAttribute('data-mode')===mode));});}
var stickEl=$('stick'),knob=$('knob');
var walk={x:0,z:0.9,yaw:0,pitch:0,rad:0.2};
function placeWalkCam(){cam.position.set(walk.x,1.62,walk.z);cam.rotation.set(walk.pitch,walk.yaw,0);}
function enterWalk(){
  snap=Object.assign({},S); S.roof=true;S.front=true;S.see=false;S.labels=false;S.dims=false;S.plumb=false;S.elec=false; apply();
  controls.enabled=false; tw=null; cam.fov=72; cam.updateProjectionMatrix();
  cam.rotation.order='YXZ'; walk.x=0;walk.z=Z1-0.5;walk.yaw=0;walk.pitch=0; placeWalkCam();
  stickEl.hidden=false; layersBtn.disabled=true; layersPanel.hidden=true; layersBtn.setAttribute('aria-expanded','false');
}
function leaveWalk(){
  if(snap){Object.assign(S,snap);snap=null;} apply();
  cam.rotation.order='XYZ'; cam.fov=45; cam.updateProjectionMatrix(); controls.enabled=true;
  stickEl.hidden=true; layersBtn.disabled=false; jx=0;jz=0; knob.style.transform='';
}
function setMode(m){
  if(m===mode&&m!=='orbit'&&m!=='top'&&m!=='tour')return;
  if(m===mode){flyTo(getView(m==='tour'?'orbit':m),700);return;}
  var prev=mode; mode=m; setSegUI();
  if(prev==='walk'){leaveWalk();applyView(getView('orbit'));}
  if(prev==='top'&&autoSee){S.see=false;autoSee=false;apply();}
  tourEl.hidden=m!=='tour';
  if(m==='walk')enterWalk();
  else if(m==='top'){S.roof=false;if(!S.see){S.see=true;autoSee=true;}apply();flyTo(getView('top'),900);}
  else if(m==='tour')showStep(0);
  else flyTo(getView('orbit'),900);
  showHint(HINTS[m]);
}
segBtns.forEach(function(b){b.addEventListener('click',function(){setMode(b.getAttribute('data-mode'));});});
Array.prototype.forEach.call(document.querySelectorAll('.chip'),function(c){
  c.addEventListener('click',function(){
    var v=c.getAttribute('data-view');
    if(mode==='walk'){mode='orbit';setSegUI();leaveWalk();applyView(getView('orbit'));}
    else if(mode==='top'){mode='orbit';setSegUI();if(autoSee){S.see=false;autoSee=false;apply();}}
    else if(mode==='tour'){mode='orbit';setSegUI();tourEl.hidden=true;}
    if(v==='door'){S.front=true;S.door=true;apply();}
    flyTo(getView(v),1000);
  });
});

/* ---- walking ---- */
var jx=0,jz=0,keys={},sPtr=null,look=null;
function moveKnob(e){
  var r=stickEl.getBoundingClientRect(),cx=r.left+r.width/2,cyy=r.top+r.height/2,max=r.width/2-18;
  var dx=e.clientX-cx,dy=e.clientY-cyy,len=Math.hypot(dx,dy); if(len>max){dx*=max/len;dy*=max/len;}
  knob.style.transform='translate('+dx+'px,'+dy+'px)'; jx=dx/max; jz=dy/max;
}
stickEl.addEventListener('pointerdown',function(e){sPtr=e.pointerId;stickEl.setPointerCapture(sPtr);moveKnob(e);e.stopPropagation();});
stickEl.addEventListener('pointermove',function(e){if(e.pointerId===sPtr)moveKnob(e);});
function stickEnd(e){if(e.pointerId===sPtr){sPtr=null;jx=0;jz=0;knob.style.transform='';}}
stickEl.addEventListener('pointerup',stickEnd); stickEl.addEventListener('pointercancel',stickEnd);
canvas.addEventListener('pointerdown',function(e){if(mode!=='walk')return;look={id:e.pointerId,x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener('pointermove',function(e){
  if(mode!=='walk'||!look||e.pointerId!==look.id)return;
  walk.yaw+=(e.clientX-look.x)*0.0055; walk.pitch=Math.max(-1.2,Math.min(1.2,walk.pitch+(e.clientY-look.y)*0.0055)); look.x=e.clientX;look.y=e.clientY;
});
function lookEnd(e){if(look&&e.pointerId===look.id)look=null;}
canvas.addEventListener('pointerup',lookEnd); canvas.addEventListener('pointercancel',lookEnd);
window.addEventListener('keydown',function(e){keys[e.key.toLowerCase()]=true;});
window.addEventListener('keyup',function(e){keys[e.key.toLowerCase()]=false;});
function hits(x,z){
  var r=walk.rad;
  if(x<X0+r||x>X1-r||z<Z0+r||z>Z1-r)return true;
  for(var i=0;i<obs.length;i++){var o=obs[i];if(o.opt&&!o.opt())continue;
    var cx=Math.max(o.x0,Math.min(x,o.x1)),cz=Math.max(o.z0,Math.min(z,o.z1));
    if((x-cx)*(x-cx)+(z-cz)*(z-cz)<r*r)return true;}
  return false;
}
function stepWalk(dt){
  var f=-jz,rt=jx;
  if(keys.w||keys.arrowup)f+=1; if(keys.s||keys.arrowdown)f-=1; if(keys.d)rt+=1; if(keys.a)rt-=1;
  if(keys.arrowleft)walk.yaw+=1.6*dt; if(keys.arrowright)walk.yaw-=1.6*dt;
  var len=Math.hypot(f,rt); if(len>1){f/=len;rt/=len;}
  var sp=1.5*dt,s=Math.sin(walk.yaw),c=Math.cos(walk.yaw),vx=(-s*f+c*rt)*sp,vz=(-c*f-s*rt)*sp;
  if(!hits(walk.x+vx,walk.z))walk.x+=vx; if(!hits(walk.x,walk.z+vz))walk.z+=vz;
  placeWalkCam();
}

/* ---- labels ---- */
var pv=new THREE.Vector3();
function updLabels(){
  if(!S.labels||mode==='walk')return;
  var w=stage.clientWidth,h=stage.clientHeight,dist=cam.position.distanceTo(controls.target);
  for(var i=0;i<labs.length;i++){
    var L=labs[i];
    if((L.cond&&!L.cond())||(L.near&&dist>L.near)){L.el.style.display='none';continue;}
    pv.set(L.p[0],L.p[1],L.p[2]).project(cam);
    if(pv.z>1||pv.z<-1){L.el.style.display='none';continue;}
    L.el.style.display='';
    L.el.style.transform='translate('+((pv.x*0.5+0.5)*w).toFixed(1)+'px,'+((-pv.y*0.5+0.5)*h).toFixed(1)+'px) translate(-50%,-110%)';
  }
}

/* ---- resize + loop ---- */
var aspCat='';
function resize(){
  var w=stage.clientWidth,h=stage.clientHeight; if(!w||!h)return;
  renderer.setSize(w,h,false); cam.aspect=w/h; cam.updateProjectionMatrix();
  var cat=w/h<0.85?'p':'l';
  if(aspCat&&cat!==aspCat&&mode!=='walk'&&mode!=='tour')flyTo(getView(mode),600); aspCat=cat;
}
if(window.ResizeObserver)new ResizeObserver(resize).observe(stage); else window.addEventListener('resize',resize);
build(); resize(); applyView(getView('orbit')); setSegUI(); showHint(HINTS.orbit);
window.__t={build:build,D:D,S:S,setMode:setMode,apply:apply,getView:getView,showStep:showStep,STEPS:STEPS};
var last=performance.now();
function frame(now){
  var dt=Math.min(0.05,(now-last)/1000); last=now;
  /* sliding door animation */
  var tgt=S.door?1:0; doorK+=(tgt-doorK)*Math.min(1,dt*6); if(G.doorPanel)G.doorPanel.position.x=doorK*0.95;
  if(tw)stepTween(now);
  if(mode==='walk')stepWalk(dt); else controls.update();
  updLabels(); renderer.render(scene,cam);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
